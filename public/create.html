<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot Oluştur</title>
<style>
  body{font-family:system-ui;background:#0f1115;color:#eee;margin:0;display:grid;place-items:center;min-height:100vh}
  .box{width:340px;padding:24px;background:#1a1d24;border-radius:12px}
  label{display:block;margin-top:12px;font-size:14px;color:#aaa}
  input{width:100%;box-sizing:border-box;padding:10px;margin-top:4px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#fff;font-size:15px}
  button{width:100%;padding:10px;margin-top:16px;border:0;border-radius:8px;background:#4f7cff;color:#fff;font-size:15px;cursor:pointer}
  .key{margin-top:12px;font-size:12px;word-break:break-all;background:#0f1115;padding:8px;border-radius:6px}
  .warn{color:#ffb84d;font-size:13px;margin-top:12px}
  .err{color:#ff6b6b;margin-top:10px;min-height:18px}
  small{color:#888}
</style>
</head>
<body>
<div class="box">
  <h3>Bot Oluştur</h3>
  <form id="f">
    <label>Bot adı
      <input name="name" required maxlength="80" placeholder="Örn: Sunucu Botu">
    </label>
    <label>Site alanı (domain)
      <input name="domain" required maxlength="253" placeholder="Örn: siteniz.com">
    </label>
    <button type="submit">Oluştur</button>
  </form>
  <div class="err" id="err"></div>
  <div id="result" hidden>
    <label>Web Key <small>(sitene koyabilirsin)</small></label>
    <div class="key" id="wk"></div>
    <label>Secret Key <small>(sadece sunucunda sakla)</small></label>
    <div class="key" id="sk"></div>
    <div class="warn">Secret key yalnızca bu ekranda gösterilir. Şimdi kopyala ve güvenli bir yere kaydet.</div>
  </div>
</div>
<script>
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    err.textContent = '';
    const { name, domain } = Object.fromEntries(new FormData(e.target));
    const r = await fetch('/api/bots/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, domain }),
    });
    const j = await r.json();
    if (!r.ok) { err.textContent = j.error || 'Hata oluştu'; return; }
    document.getElementById('wk').textContent = j.webKey;
    document.getElementById('sk').textContent = j.secretKey;
    document.getElementById('result').hidden = false;
    e.target.reset();
  };
</script>
</body>
</html>
