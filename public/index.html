<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot Doğrulama Test</title>
<style>
  body{font-family:system-ui;background:#0f1115;color:#eee;margin:0;display:grid;place-items:center;min-height:100vh}
  .box{width:340px;padding:24px;background:#1a1d24;border-radius:12px}
  label{display:block;margin-top:12px;font-size:14px;color:#aaa}
  input{width:100%;box-sizing:border-box;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#fff;font-size:14px}
  button{width:100%;padding:10px;margin-top:16px;border:0;border-radius:8px;background:#4f7cff;color:#fff;font-size:15px;cursor:pointer}
  #frame{display:none;width:100%;height:320px;border:0;margin-top:16px;border-radius:12px;background:#0f1115}
  #result{margin-top:14px;padding:10px;border-radius:8px;background:#0f1115;font-size:14px;word-break:break-all;min-height:18px}
  .ok{color:#4ade80}.bad{color:#ff6b6b}
</style>
</head>
<body>
<div class="box">
  <h3>Bot Doğrulama Testi</h3>

  <label>Web Key
    <input id="wk" placeholder="wk_...">
  </label>
  <label>Secret Key
    <input id="sk" type="password" placeholder="sk_...">
  </label>

  <button id="start">Doğrulamayı Başlat</button>

  <iframe id="frame"></iframe>
  <div id="result"></div>
</div>

<script>
  const frame = document.getElementById('frame');
  const result = document.getElementById('result');

  document.getElementById('start').onclick = () => {
    const wk = document.getElementById('wk').value.trim();
    const sk = document.getElementById('sk').value.trim();
    result.textContent = '';
    result.className = '';

    if (!wk || !sk) {
      result.textContent = 'Web key ve secret key gir.';
      result.className = 'bad';
      return;
    }
    frame.src = `/verify.html?webKey=${encodeURIComponent(wk)}`;
    frame.style.display = 'block';
    frame.dataset.secret = sk;
  };

  window.addEventListener('message', async (e) => {
    if (e.source !== frame.contentWindow || e.data?.type !== 'botverify:pass') return;

    frame.style.display = 'none';
    result.textContent = 'Doğrulanıyor...';

    const r = await fetch('/api/siteverify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secretKey: frame.dataset.secret, pass: e.data.pass }),
    });
    const j = await r.json();

    if (j.success) {
      result.textContent = `Başarılı. Bot ID: ${j.botId}`;
      result.className = 'ok';
    } else {
      result.textContent = `Başarısız: ${j.reason}`;
      result.className = 'bad';
    }
  });
</script>
</body>
</html>
